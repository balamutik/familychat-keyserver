name: Publish FamilyChat keyserver release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Validate version and installer
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REPOSITORY" == balamutik/familychat-keyserver ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; publish a new version instead of replacing it."
            exit 1
          fi
          python3 -m unittest discover -s scripts/tests -v
          bash -n install.sh scripts/*.sh
          shellcheck install.sh scripts/*.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go service
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Require anonymous public image access
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE" > /dev/null; then
            echo 'GHCR image is private or unavailable. Make the familychat-keyserver package public in GitHub package settings, then rerun this workflow. Release assets have not been published.'
            exit 1
          fi
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE"
      - name: Package and validate deployment
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/package-release.py --version "$VERSION" --image "$IMAGE" --output /tmp/keyserver-release
          python3 scripts/tests/validate_compose.py /tmp/keyserver-release/familychat-keyserver.tar.gz
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          gh release create "$VERSION" --verify-tag --title "FamilyChat keyserver $VERSION" --generate-notes \
            /tmp/keyserver-release/familychat-keyserver.tar.gz \
            /tmp/keyserver-release/install.sh \
            /tmp/keyserver-release/SHA256SUMS
