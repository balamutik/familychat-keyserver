name: familychat-keyserver
services:
  keyserver:
    image: ${KEYSERVER_IMAGE:-familychat-keyserver:local}
    build:
      context: ${KEYSERVER_BUILD_CONTEXT:-.}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${KEYSERVER_BIND_ADDRESS:-0.0.0.0}:${KEYSERVER_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${KEYSERVER_STATE_DIR:-./state}
        target: /state
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KEYSERVER_TLS_DIR:-./tls}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KEYSERVER_GRANTS_DIR:-./grants}
        target: /grants
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /familychat-keyserver, health, --url, "https://${KEYSERVER_DOMAIN:-localhost}:8443/health/ready", --connect, "127.0.0.1:8443", --ca, /tls/fullchain.pem]
      interval: 30s
      timeout: 6s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
